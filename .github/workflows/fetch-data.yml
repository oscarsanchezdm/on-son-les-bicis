name: Fetch Bicing data

on:
  schedule:
    # GitHub no garanteix el cron: pot retardar-lo o saltar-se'l sota càrrega.
    # Declarem 4 slots/hora en minuts poc congestionats; el lliurat real sol ser
    # ~1–2/hora. Per interval fiable de ~30 min, configura INGEST_CHAIN_TOKEN
    # (vegeu README) o un cron extern amb repository_dispatch.
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [bicing-ingest]

concurrency:
  # No cancel·lar runs en curs: evita que el cron es mengi sol quan s'acumula cua
  group: bicing-ingest
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch static data if missing
        if: hashFiles('public/data/static/barris.geojson') == ''
        run: python scripts/fetch_static_data.py

      - name: Ingest and export
        env:
          # Open Data BCN (mateix API que bicing-hassio); GBFS només si falla o falta token
          BICING_TOKEN: ${{ secrets.BICING_TOKEN }}
        run: |
          python scripts/init_db.py
          python scripts/ingest.py
          python scripts/export.py

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Actualitza dades Bicing"
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push origin main; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              if [ "$attempt" -eq 4 ]; then
                echo "Failed to push data after ${attempt} attempts."
                exit 1
              fi
              sleep $((attempt * 4))
            done
          fi

  # Encadena el següent ingest ~28 min després. El GITHUB_TOKEN no pot disparar
  # workflows (anti-recursió); cal un PAT fi a INGEST_CHAIN_TOKEN.
  # Sense el secret, aquest job acaba al moment i el cron de GitHub queda com a únic disparador.
  chain-next:
    needs: ingest
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: bicing-ingest-chain
      cancel-in-progress: true
    steps:
      - name: Wait and dispatch next ingest
        env:
          GH_TOKEN: ${{ secrets.INGEST_CHAIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Sense INGEST_CHAIN_TOKEN: només el cron de GitHub (best-effort, sovint 1–2/h)."
            exit 0
          fi
          echo "Esperant 28 min abans del següent ingest…"
          sleep 1680
          # Exclou aquest mateix run (encara in_progress mentre dormim)
          others=$(gh run list --workflow=fetch-data.yml --repo "$GITHUB_REPOSITORY" \
            --limit 20 --json databaseId,status --jq \
            "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and (.status == \"in_progress\" or .status == \"queued\" or .status == \"pending\"))] | length")
          if [ "${others:-0}" -gt 0 ]; then
            echo "Ja hi ha un altre ingest en curs/cua; no encadeno."
            exit 0
          fi
          gh workflow run fetch-data.yml --repo "$GITHUB_REPOSITORY"
          echo "Següent ingest disparat."

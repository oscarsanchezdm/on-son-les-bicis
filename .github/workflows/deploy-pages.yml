name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Fetch Bicing data"]
    types: [completed]
  push:
    branches: [main]
    paths-ignore:
      - "public/data/**"
  workflow_dispatch:

concurrency:
  group: bicing-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest data commit
        run: git pull --ff-only origin main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build site
        run: |
          npm install
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
